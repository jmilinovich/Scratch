[project]
name = "whoop-hr"
version = "0.1.0"
description = "Per-sample overnight heart-rate from WHOOP, with an MCP server. Prefers the official consented API; falls back to the internal web-app API only if forced."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
whoop-hr-auth = "whoop_hr.cli:auth_main"
whoop-hr-validate = "whoop_hr.cli:validate_main"
whoop-hr-mcp = "whoop_hr.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_hr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
